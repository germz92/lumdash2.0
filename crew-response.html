<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Availability Request — LumDash</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background: #111214;
      color: #e8e8ea;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px 48px;
    }
    .cr-wrap { width: 100%; max-width: 480px; }
    .cr-brand {
      text-align: center;
      color: #CC0007;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.02em;
      margin-bottom: 20px;
    }
    .cr-card {
      background: #1a1b1e;
      border: 1px solid #2a2b2f;
      border-radius: 12px;
      padding: 24px 20px;
    }
    .cr-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
    .cr-subtitle { color: #9a9ba1; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
    .cr-event {
      background: #232428;
      border-radius: 8px;
      padding: 12px 14px;
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 20px;
    }
    .cr-day {
      border: 1px solid #2a2b2f;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .cr-day-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; }
    .cr-day-date { font-weight: 700; font-size: 1rem; }
    .cr-day-role { color: #9a9ba1; font-size: 0.82rem; text-align: right; }
    .cr-choices { display: flex; gap: 10px; }
    .cr-choice {
      flex: 1;
      padding: 12px 0;
      border-radius: 8px;
      border: 1px solid #3a3b40;
      background: transparent;
      color: #c9cacf;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cr-choice:active { transform: scale(0.98); }
    .cr-choice.accept.selected { background: #143d24; border-color: #22c55e; color: #4ade80; }
    .cr-choice.decline.selected { background: #43181b; border-color: #ef4444; color: #f87171; }
    .cr-locked {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #4ade80;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .cr-locked.declined { color: #f87171; }
    .cr-locked small { color: #9a9ba1; font-weight: 400; }
    .cr-submit {
      width: 100%;
      margin-top: 8px;
      padding: 15px 0;
      border: none;
      border-radius: 10px;
      background: #CC0007;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .cr-submit:disabled { opacity: 0.5; cursor: default; }
    .cr-msg { margin-top: 14px; text-align: center; font-size: 0.95rem; line-height: 1.5; }
    .cr-msg.ok { color: #4ade80; }
    .cr-msg.err { color: #f87171; }
    .cr-note { margin-top: 16px; color: #7a7b81; font-size: 0.8rem; text-align: center; line-height: 1.5; }
    .cr-loading { text-align: center; color: #9a9ba1; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="cr-wrap">
    <div class="cr-brand">Lumetry Media</div>
    <div class="cr-card" id="crCard">
      <div class="cr-loading">Loading your request&hellip;</div>
    </div>
    <div class="cr-note">You can update your answers by reopening this link — until days are confirmed by the event owner.</div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/crew-response.js"></script>
</body>
</html>
