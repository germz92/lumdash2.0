<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121216">
  <script src="js/theme-early.js?v=2.0.0"></script>
  <title>Login - LumDash</title>
  <link rel="shortcut icon" type="image/x-icon" href="assets/favicon.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="css/theme-tokens.css?v=2.0.0">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/theme-light.css?v=2.0.0">
  <script src="js/theme.js?v=2.0.0"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body class="login-page">
  <!-- Splash Screen -->
  <div id="splashScreen">
    <img src="assets/favicon.png" alt="Logo" style="width:48px;height:48px;margin-bottom:24px;">
    <div class="loader"></div>
  </div>
  
  <div class="auth-wrapper" id="authWrapper" style="display:none;">
    <div class="auth-card">
      <img src="assets/Logo - Dark BG.png" alt="Lumetry Media" class="auth-logo">
      
      <h1>Welcome Back</h1>
      <h2>Sign in to your account</h2>
      
      <input id="email" placeholder="Email address" type="email" autocomplete="email">
      <input id="password" placeholder="Password" type="password" autocomplete="current-password">
      
      <p class="auth-note">New accounts are invite-only. Contact your administrator if you need access.</p>
      
      <button id="loginButton" onclick="login()">Sign In</button>
      
      <a href="#" id="forgotPasswordLink" class="toggle-link">Forgot your password?</a>
    </div>
  </div>

  <script src="js/login.js"></script>
  <script>
    // Show auth wrapper after splash
    setTimeout(() => {
      const splash = document.getElementById('splashScreen');
      const auth = document.getElementById('authWrapper');
      if (splash) splash.style.display = 'none';
      if (auth) auth.style.display = 'flex';
    }, 800);
    
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('✅ ServiceWorker registered:', reg.scope))
        .catch(err => console.warn('❌ ServiceWorker registration failed:', err));
    }
  </script>
</body>
</html>
