<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121216">
    <script src="js/theme-early.js?v=2.0.0"></script>
    <title>Inventory - LumDash</title>
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/theme-tokens.css?v=2.0.0">
    <link rel="stylesheet" href="css/theme-dark.css?v=2.0.0">
    <link rel="stylesheet" href="css/theme-light.css?v=2.0.0">
    <script src="js/theme.js?v=2.0.0"></script>
    <style>
        /* Override global overflow hidden from theme-dark.css */
        html, body {
            overflow: auto !important;
            height: auto !important;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: var(--bg-secondary);
            padding: 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-default);
            margin-bottom: 24px;
            border-left: 4px solid var(--brand-red);
        }

        .header h1 {
            margin: 0 0 8px 0;
            color: var(--text-primary);
            font-size: 28px;
            font-weight: 700;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 16px;
        }

        .date-info {
            background: var(--bg-tertiary);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--text-secondary);
            border: 1px solid var(--border-default);
        }

        .back-button {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-default);
            padding: 12px 20px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }

        .back-button:hover {
            background: var(--bg-hover);
            border-color: var(--brand-red);
            transform: translateY(-2px);
        }

        .search-section {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-default);
            margin-bottom: 24px;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            font-size: 16px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--brand-red);
            box-shadow: 0 0 0 3px var(--brand-red-muted);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .category-filter {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-default);
            background: var(--bg-tertiary);
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .category-btn.active {
            background: var(--brand-red);
            color: white;
            border-color: var(--brand-red);
        }

        .category-btn:hover {
            border-color: var(--brand-red);
            color: var(--text-primary);
        }

        .category-btn.active:hover {
            color: white;
        }

        .filter-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            margin-bottom: 8px;
        }

        .active-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-tag {
            background: var(--brand-red);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .sort-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sort-control label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .sort-control select {
            padding: 6px 12px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sort-control select:focus {
            outline: none;
            border-color: var(--brand-red);
            box-shadow: 0 0 0 3px var(--brand-red-muted);
        }

        .brand-filter {
            margin-top: 16px;
        }

        .brand-filter-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            transition: all 0.2s ease;
            margin-bottom: 8px;
        }

        .brand-filter-header:hover {
            background: var(--bg-hover);
            border-color: var(--brand-red);
        }

        .brand-filter-header.active {
            background: rgba(204, 0, 7, 0.1);
            border-color: var(--brand-red);
        }

        .brand-filter-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .brand-filter-toggle {
            transition: transform 0.2s ease;
            color: var(--text-tertiary);
        }

        .brand-filter-toggle.expanded {
            transform: rotate(180deg);
        }

        .brand-filter-content {
            display: none;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-default);
            border-top: none;
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            max-height: 200px;
            overflow-y: auto;
        }

        .brand-filter-content.show {
            display: block;
        }

        .brand-filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-right: 8px;
        }

        @media (max-width: 768px) {
            .brand-filter-header {
                padding: 10px 12px;
            }

            .brand-filter-title span:last-child {
                font-size: 12px;
            }

            .brand-filter-content {
                max-height: 150px;
                padding: 8px 12px;
            }

            .brand-filter-buttons {
                gap: 6px;
            }

            .brand-filter-buttons .category-btn {
                font-size: 13px;
                padding: 6px 12px;
            }
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .inventory-item {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 20px;
            border: 1px solid var(--border-default);
            transition: all 0.2s ease;
        }

        .inventory-item:hover {
            transform: translateY(-2px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-lg);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .item-details h3 {
            margin: 0 0 8px 0;
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
        }

        .item-brand {
            color: var(--text-tertiary);
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .item-model {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
        }

        .item-category {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .item-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 12px;
            color: var(--text-tertiary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .serial-code {
            font-family: var(--font-mono);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            padding: 2px 6px;
            border-radius: var(--radius-xs);
            font-size: 13px;
        }

        .item-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--brand-red);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--brand-red-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-default);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }

        .btn-success {
            background: #22c55e;
            color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-available {
            background: var(--status-live-bg);
            color: var(--status-live);
        }

        .status-in-cart {
            background: var(--status-upcoming-bg);
            color: var(--status-upcoming);
        }

        .status-out-of-stock {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .status-partial {
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
        }

        /* Floating Cart Button - Aligned to container */
        .cart-button-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            margin-left: -560px; /* Half of max-width 1200px, minus some padding */
            background: transparent;
            padding: 0;
            border: none;
            z-index: 1000;
        }

        .cart-button-content {
            display: flex;
            align-items: center;
        }

        .cart-button {
            background: #1a1a1a !important;
            color: #ffffff !important;
            border: 1px solid #2a2a2a !important;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cart-button:hover {
            background: #252525 !important;
            border-color: #cc0007 !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
        }

        .cart-button .material-symbols-outlined {
            font-size: 20px;
            color: #ffffff !important;
        }

        .cart-count {
            background: #cc0007;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }

        /* Hide cart count when empty or zero */
        .cart-count.hidden {
            display: none !important;
        }

        /* Responsive: align to left edge on smaller screens */
        @media (max-width: 1280px) {
            .cart-button-container {
                left: 24px;
                transform: none;
                margin-left: 0;
            }
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-default);
            border-top: 4px solid var(--brand-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
        }

        .empty-icon {
            font-size: 64px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: var(--surface-overlay);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-content {
            background: var(--bg-secondary);
            margin: 10% auto;
            padding: 0;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-default);
            box-shadow: var(--shadow-xl);
            width: 90%;
            max-width: 500px;
            max-height: 70vh;
            overflow: hidden;
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-default);
            background: var(--bg-tertiary);
        }

        .modal-header h3 {
            margin: 0;
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 600;
        }

        .modal-body {
            padding: 24px;
            max-height: 400px;
            overflow-y: auto;
            color: var(--text-primary);
        }

        .modal-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--border-default);
            background: var(--bg-tertiary);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .serial-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--bg-tertiary);
        }

        .serial-option:hover {
            border-color: var(--brand-red);
            background: rgba(204, 0, 7, 0.1);
        }

        .serial-option.selected {
            border-color: var(--brand-red);
            background: rgba(204, 0, 7, 0.15);
        }

        .serial-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .serial-info .serial-code {
            color: var(--text-primary);
        }

        .serial-info small {
            color: var(--text-tertiary);
        }

        .quantity-input {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
        }

        .quantity-input label {
            color: var(--text-secondary);
        }

        .quantity-input input {
            width: 80px;
            padding: 8px 12px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            text-align: center;
            font-size: 16px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .quantity-input input:focus {
            outline: none;
            border-color: var(--brand-red);
        }

        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }

            .inventory-grid {
                grid-template-columns: 1fr;
            }

            .header-info {
                flex-direction: column;
                align-items: flex-start;
            }

            .category-filter {
                gap: 6px;
            }

            .category-btn {
                font-size: 13px;
                padding: 6px 12px;
            }

            .modal-content {
                margin: 5% auto;
                width: 95%;
            }

            .cart-button-container {
                bottom: 16px;
                left: 16px;
            }

            .cart-button {
                padding: 10px 16px;
                font-size: var(--font-size-xs);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-button" onclick="goBack()">
            <span class="material-symbols-outlined">arrow_back</span>
            Back to Gear List
        </button>

        <div class="header">
            <div class="header-info">
                <div>
                    <h1>Inventory</h1>
                    <p>Browse and add items to your cart for reservation</p>
                </div>
                <div class="date-info" id="dateInfo">
                    Loading dates...
                </div>
            </div>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search inventory..." onkeyup="filterInventory()">
                <span class="material-symbols-outlined">search</span>
            </div>
            <div class="filter-controls">
                <div class="active-filters" id="activeFilters">
                    <!-- Active filter tags will appear here -->
                </div>
                <div class="sort-control">
                    <label for="sortSelect">Sort:</label>
                    <select id="sortSelect" onchange="changeSortOrder()">
                        <option value="asc">A-Z (Model)</option>
                        <option value="desc">Z-A (Model)</option>
                    </select>
                </div>
            </div>
            <div class="category-filter">
                <button class="category-btn active" onclick="filterByCategory('all', this)">All</button>
                <button class="category-btn" onclick="filterByCategory('Cameras', this)">Cameras</button>
                <button class="category-btn" onclick="filterByCategory('Lenses', this)">Lenses</button>
                <button class="category-btn" onclick="filterByCategory('Lighting', this)">Lighting</button>
                <button class="category-btn" onclick="filterByCategory('Support', this)">Support</button>
                <button class="category-btn" onclick="filterByCategory('Accessories', this)">Accessories</button>
                <button class="category-btn" onclick="filterByCategory('Audio', this)">Audio</button>
                <button class="category-btn" onclick="filterByCategory('Storage', this)">Storage</button>
                <button class="category-btn" onclick="filterByCategory('Power', this)">Power</button>
                <button class="category-btn" onclick="filterByCategory('Computers', this)">Computers</button>
            </div>
            <div class="brand-filter" id="brandFilter">
                <!-- Brand buttons will be populated dynamically -->
            </div>
        </div>

        <div id="inventoryContainer" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading inventory...</p>
        </div>
    </div>

    <!-- Floating Cart Button -->
    <div class="cart-button-container">
        <div class="cart-button-content">
            <button class="cart-button" onclick="viewCart()" id="cartButton" title="View Cart">
                <span class="material-symbols-outlined">shopping_cart</span>
                <span>Cart</span>
                <span class="cart-count hidden" id="cartCount"></span>
            </button>
        </div>
    </div>

    <!-- Serial Selection Modal -->
    <div id="serialModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Select Serial Number</h3>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Serial options will be populated here -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="addSelectedToCart()" id="addToCartBtn">Add to Cart</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        let currentInventory = [];
        let filteredInventory = [];
        let currentCart = null;
        let eventId = null;
        let selectedSerial = null;
        let selectedInventoryId = null;
        let selectedQuantity = 1;
        let currentItemForModal = null;
        // For real serial numbers, multiple units must each be a DIFFERENT serial.
        // Tracks the distinct serial units the user has toggled on: [{ inventoryId, serial }]
        let selectedSerialUnits = [];
        let currentCategory = 'all';
        let currentBrand = 'all';
        let currentSort = 'asc';

        // Button loading state functions
        function showButtonLoading(button) {
            if (!button) return;
            
            // Store original content
            button.setAttribute('data-original-html', button.innerHTML);
            
            // Show loading state
            button.innerHTML = `
                <div class="loading-spinner" style="width: 16px; height: 16px; border: 2px solid #ffffff40; border-top: 2px solid #ffffff; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px;"></div>
                Adding...
            `;
            button.disabled = true;
            button.style.cursor = 'not-allowed';
        }

        function hideButtonLoading(button) {
            if (!button) return;
            
            // Restore original content
            const originalHtml = button.getAttribute('data-original-html');
            if (originalHtml) {
                button.innerHTML = originalHtml;
                button.removeAttribute('data-original-html');
            }
            button.disabled = false;
            button.style.cursor = 'pointer';
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', async function() {
            eventId = new URLSearchParams(window.location.search).get('eventId');
            if (!eventId) {
                alert('No event ID provided');
                window.history.back();
                return;
            }

            // Load cart first, then inventory (to ensure cart state is available for rendering)
            await loadCart();
            await loadInventory();
            loadDateInfo();
        });

        // Load inventory items
        async function loadInventory() {
            try {
                // Try to load with availability calculations first
                let response = await fetch(`${API_BASE}/api/gear-inventory/available/${eventId}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                // If that fails (no dates set), fall back to regular inventory
                if (!response.ok) {
                    console.log('Could not load inventory with availability, falling back to regular inventory');
                    response = await fetch(`${API_BASE}/api/gear-inventory`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                }

                if (!response.ok) {
                    throw new Error('Failed to load inventory');
                }

                currentInventory = await response.json();
                filteredInventory = [...currentInventory];
                setupBrandFilter();
                restoreCategoryFilterState();
                updateActiveFiltersDisplay();
                filterAndRenderInventory();
            } catch (error) {
                console.error('Error loading inventory:', error);
                document.getElementById('inventoryContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <h3>Failed to load inventory</h3>
                        <p>Please refresh the page to try again.</p>
                    </div>

        }

        // Apply all filters and render
        function filterAndRenderInventory() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            console.log('Applying filters - Category:', currentCategory, 'Brand:', currentBrand, 'Search:', searchTerm); // Debug log
            
            filteredInventory = currentInventory.filter(item => {
                const labelParts = (item.label || '').split(' ');
                const brand = labelParts[0] || 'Unknown';
                const model = labelParts.slice(1).join(' ') || 'Unknown';
                
                // Apply search filter
                const matchesSearch = !searchTerm || 
                    item.label.toLowerCase().includes(searchTerm) ||
                    item.category.toLowerCase().includes(searchTerm) ||
                    brand.toLowerCase().includes(searchTerm) ||
                    model.toLowerCase().includes(searchTerm);
                
                // Apply category filter
                const matchesCategory = currentCategory === 'all' || item.category === currentCategory;
                
                // Apply brand filter
                const matchesBrand = currentBrand === 'all' || brand === currentBrand;
                
                // Debug log for items that match all criteria
                const passes = matchesSearch && matchesCategory && matchesBrand;
                if (passes) {
                    console.log(`✓ Item passes: ${item.label} (Category: ${item.category}, Brand: ${brand})`);
                }
                
                return passes;
            });
            
            console.log(`Filtered results: ${filteredInventory.length} items`); // Debug log

        // Render inventory
        function renderInventory() {
            const container = document.getElementById('inventoryContainer');
            
            if (filteredInventory.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📦</div>
                        <h3>No items found</h3>
                        <p>Try adjusting your search or filter criteria.</p>
                    </div>
                `;
                return;
            }

            // Group items by brand + model
            const groupedItems = {};
            filteredInventory.forEach(item => {
                const labelParts = (item.label || '').split(' ');
                const brand = labelParts[0] || 'Unknown';
                const model = labelParts.slice(1).join(' ') || 'Unknown';
                const key = `${brand} ${model}`;
                
                if (!groupedItems[key]) {
                    groupedItems[key] = {
                        brand,
                        model,
                        category: item.category,
                        items: [],
                        totalAvailable: 0,
                        totalQuantity: 0,
                        hasItemsInCart: false,
                        totalCartQuantity: 0
                    };
                }
                
                groupedItems[key].items.push(item);
                groupedItems[key].totalQuantity += (item.quantity || 1);
                
                // Calculate availability and cart status
                const inCart = isItemInCart(item._id);
                const availableQty = getAvailableQuantity(item);
                
                if (inCart) {
                    groupedItems[key].hasItemsInCart = true;
                    // Find the cart item to get its quantity
                    const cartItem = currentCart.items.find(cartItem => 
                        cartItem.inventoryId && cartItem.inventoryId._id === item._id
                    );
                    if (cartItem) {
                        groupedItems[key].totalCartQuantity += cartItem.quantity;
                    }
                }
                
                // Add available quantity from this specific item
                groupedItems[key].totalAvailable += availableQty;
            });

            // Sort grouped items by model name
            const sortedGroups = Object.values(groupedItems).sort((a, b) => {
                if (currentSort === 'asc') {
                    return a.model.localeCompare(b.model);
                } else {
                    return b.model.localeCompare(a.model);
                }
            });
            
            // For each group, calculate the correct available quantity
            Object.values(groupedItems).forEach(group => {
                // The backend availableQuantity only considers hard reservations, not cart items
                // We need to subtract cart items from the displayed availability
                if (group.totalCartQuantity > 0) {
                    // Calculate how much is actually available for additional reservations
                    // Available for display = backend available - what's already in cart
                    group.totalAvailable = Math.max(0, group.totalAvailable - group.totalCartQuantity);
                }
            });

            const inventoryHTML = `
                <div class="inventory-grid">
                    ${sortedGroups.map(group => {
                        let statusBadge, actionButton;
                        
                        if (group.hasItemsInCart && group.totalAvailable === 0) {
                            statusBadge = `<span class="status-badge status-in-cart">In Cart</span>`;
                            actionButton = `<button class="btn btn-success" disabled>
                                <span class="material-symbols-outlined">check</span>
                                In Cart
                            </button>`;
                        } else if (group.totalAvailable === 0) {
                            statusBadge = `<span class="status-badge status-out-of-stock">Out of Stock</span>`;
                            actionButton = `<button class="btn btn-secondary" disabled>
                                <span class="material-symbols-outlined">block</span>
                                Out of Stock
                            </button>`;
                        } else {
                            statusBadge = `<span class="status-badge status-available">${group.totalAvailable} Available</span>`;
                            if (group.hasItemsInCart) {
                                statusBadge += ` <span class="status-badge status-partial">Partial in Cart</span>`;
                            }
                            // Use data attributes instead of onclick to avoid escaping issues
                            // Escape double quotes for HTML attributes
                            const safeBrand = (group.brand || '').replace(/"/g, '&quot;');
                            const safeModel = (group.model || '').replace(/"/g, '&quot;');
                            
                            actionButton = `<button class="btn btn-primary add-to-cart-btn" data-brand="${safeBrand}" data-model="${safeModel}">
                                <span class="material-symbols-outlined">add_shopping_cart</span>
                                Add to Cart
                            </button>`;
                        }

                        return `
                            <div class="inventory-item">
                                <div class="item-header">
                                    <div class="item-details">
                                        <div class="item-brand">${group.brand}</div>
                                        <h3 class="item-model">${group.model}</h3>
                                    </div>
                                    <div class="item-category">${group.category}</div>
                                </div>
                                
                                <div class="item-info">
                                    <div class="info-item">
                                        <div class="info-label">Units Available</div>
                                        <div class="info-value">${group.totalAvailable}</div>
                                    </div>
                                    <div class="info-item">
                                        <div class="info-label">Total Units</div>
                                        <div class="info-value">${group.totalQuantity}</div>
                                    </div>
                                </div>
                                
                                <div class="item-actions">
                                    ${statusBadge}
                                    ${actionButton}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            container.innerHTML = inventoryHTML;
            
            // Add event listeners for Add to Cart buttons (using event delegation)
            document.querySelectorAll('.add-to-cart-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const brand = this.getAttribute('data-brand').replace(/&quot;/g, '"');
                    const model = this.getAttribute('data-model').replace(/&quot;/g, '"');
                    
                    // Show loading state
                    showButtonLoading(this);
                    
                    // Call the async function and handle completion
                    addToCartGrouped(brand, model, this).finally(() => {
                        hideButtonLoading(this);
                    });
                });
            });
        }

        // Add to cart (for individual items - legacy)
        async function addToCart(inventoryId) {
            const item = currentInventory.find(i => i._id === inventoryId);
            if (!item) return;

            // Check if there are multiple similar items (same brand/model)
            const similarItems = getSimilarItems(item);
            
            if (similarItems.length > 1) {
                // Show serial selection modal
                showSerialModal(item, similarItems);
            } else {
                // Add directly to cart
                await addItemToCart(inventoryId, 1, null);
            }
        }

        // Add to cart (for grouped items)
        async function addToCartGrouped(brand, model, clickedButton = null) {
            // No need to decode - values come directly from data attributes
            
            // Find all items with this brand/model combination
            const groupItems = currentInventory.filter(item => {
                const labelParts = (item.label || '').split(' ');
                const itemBrand = labelParts[0] || 'Unknown';
                const itemModel = labelParts.slice(1).join(' ') || 'Unknown';
                return itemBrand === brand && itemModel === model;
            });

            if (groupItems.length === 0) return;

            // Calculate total available units across all items in the group
            let totalAvailableUnits = 0;
            let availableItems = [];
            
            groupItems.forEach(item => {
                const availableQty = getAvailableQuantity(item);
                if (availableQty > 0 && !isItemInCart(item._id)) {
                    totalAvailableUnits += availableQty;
                    availableItems.push({ item, availableQty });
                }
            });

            // If exactly 1 unit available total, add directly without modal
            if (totalAvailableUnits === 1) {
                const singleAvailableItem = availableItems[0].item;
                console.log('Only 1 unit available, adding directly:', singleAvailableItem.label);
                try {
                    await addItemToCart(singleAvailableItem._id, 1, singleAvailableItem.serial !== 'N/A' ? singleAvailableItem.serial : null);
                } catch (error) {
                    console.error('Error adding item to cart:', error);
                    // Error will be shown by addItemToCart, just ensure button loading is hidden
                }
                return;
            }

            // Multiple units available, show modal for selection
            // Hide button loading since user will now interact with modal
            if (clickedButton) {
                hideButtonLoading(clickedButton);
            }
            showSerialModalForGroup(brand, model, groupItems);
        }

        // Show serial selection modal (legacy - for individual items)

                ${hasRealSerials ? `

                            <div class="serial-info">

                                <div style="font-size: 13px; color: #666;">${similarItem.label}</div>

                            </div>

                <div class="quantity-input" id="quantityInputWrapper">

                </div>
                <div id="serialSelectionSummary" style="display:none; margin-top:12px; font-weight:600; color:#0d6efd;"></div>
            `;

            document.getElementById('serialModal').style.display = 'block';

        // Show serial selection modal for grouped items
        function showSerialModalForGroup(brand, model, groupItems) {
            // Calculate total available across all items in group
            let totalAvailable = 0;
            const availableItems = groupItems.filter(item => {
                const availableQty = getAvailableQuantity(item);
                if (availableQty > 0 && !isItemInCart(item._id)) {
                    totalAvailable += availableQty;
                    return true;
                }
                return false;
            });

            if (availableItems.length === 0) return;

            // Reset modal state completely to prevent cross-contamination
            currentItemForModal = availableItems[0]; // Use first available item as reference
            selectedSerial = null;
            selectedInventoryId = null;
            selectedQuantity = 1;
            selectedSerialUnits = [];

            document.getElementById('modalTitle').textContent = `Select Serial - ${brand} ${model}`;
            
            // Check if all items have N/A serials (no real serial numbers)
            const hasRealSerials = availableItems.some(item => item.serial && item.serial !== 'N/A');
            
            // Update description based on whether there are real serials
            const description = hasRealSerials 
                ? 'Select one or more specific serial numbers (each is a single unit), or choose "No Preference" to reserve any available units.'
                : 'This item has no serial numbers. You can reserve any available unit.';
            
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <p style="margin-bottom: 16px; color: #666;">
                    ${description}
                </p>
                
                ${hasRealSerials ? `
                    <div class="serial-option no-preference-option" data-no-pref="1">
                        <div class="serial-info">
                            <div><strong>No Preference</strong></div>
                            <div style="font-size: 13px; color: #666;">Reserve any available unit(s)</div>
                        </div>
                        <div style="color: #28a745; font-weight: 600;">
                            ${totalAvailable} available
                        </div>
                    </div>
                ` : ''}

                ${availableItems.map(item => {
                    const availableQty = getAvailableQuantity(item);
                    const isRealSerial = item.serial && item.serial !== 'N/A';
                    const displayText = isRealSerial ? `Serial: ${item.serial}` : 'No Serial Number';
                    
                    return `
                        <div class="serial-option serial-select-btn" data-serial="${(item.serial || '').replace(/"/g, '&quot;')}" data-inventory-id="${item._id}" data-real-serial="${isRealSerial ? '1' : '0'}">
                            <div class="serial-info">
                                <div><strong>${displayText}</strong></div>
                                <div style="font-size: 13px; color: #666;">${item.label}</div>
                            </div>
                            <div style="color: #28a745; font-weight: 600;">
                                ${availableQty} available
                            </div>
                        </div>
                    `;
                }).join('')}

                <div class="quantity-input" id="quantityInputWrapper">
                    <label for="quantityInput"><strong>Quantity:</strong></label>
                    <input type="number" id="quantityInput" value="1" min="1" max="${totalAvailable}" onchange="updateQuantity(this.value)">
                </div>
                <div id="serialSelectionSummary" style="display:none; margin-top:12px; font-weight:600; color:#0d6efd;"></div>
            `;

            document.getElementById('serialModal').style.display = 'block';
            wireSerialModalEvents();
            
            // Auto-select if there's only one selectable serial option (and no "No Preference")
            const serialBtns = document.querySelectorAll('.serial-select-btn');
            if (!hasRealSerials && serialBtns.length === 1) {
                serialBtns[0].click();
            }
        }

        // Wire up click handlers for the serial modal (shared by both modal builders)
        function wireSerialModalEvents() {
            // Specific serial / N/A options
            document.querySelectorAll('.serial-select-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const serial = this.getAttribute('data-serial').replace(/&quot;/g, '"');
                    const inventoryId = this.getAttribute('data-inventory-id');
                    const isRealSerial = this.getAttribute('data-real-serial') === '1';
                    if (isRealSerial) {
                        // Multi-select: each real serial is a distinct single unit
                        toggleSerialUnit(inventoryId, serial, this);
                    } else {
                        // N/A bulk item: single-select with quantity (legacy behavior)
                        selectSingleSerial(serial, inventoryId, this);
                    }
                });
            });

            // "No Preference" option (single-select, grouped)
            document.querySelectorAll('.no-preference-option').forEach(button => {
                button.addEventListener('click', function() {
                    selectNoPreference(currentItemForModal._id, this);
                });
            });
        }

        // Toggle a real-serial unit on/off (multi-select, enforces DISTINCT serials)
        function toggleSerialUnit(inventoryId, serial, el) {
            // Choosing specific serials clears any "No Preference"/N/A single selection
            selectedSerial = null;
            selectedInventoryId = null;

            const idx = selectedSerialUnits.findIndex(u => u.inventoryId === inventoryId);
            if (idx > -1) {
                selectedSerialUnits.splice(idx, 1);
                if (el) el.classList.remove('selected');
            } else {
                selectedSerialUnits.push({ inventoryId, serial });
                if (el) el.classList.add('selected');
            }

            document.querySelectorAll('.no-preference-option').forEach(o => o.classList.remove('selected'));
            updateSerialSelectionSummary();
        }

        // Single-select for N/A (no real serial) bulk items — keeps quantity input
        function selectSingleSerial(serial, inventoryId, el) {
            selectedSerialUnits = [];
            selectedSerial = serial;
            selectedInventoryId = inventoryId;
            document.querySelectorAll('.serial-option').forEach(o => o.classList.remove('selected'));
            if (el) el.classList.add('selected');
            updateSerialSelectionSummary();
        }

        // "No Preference" — reserve any available units of the brand/model (grouped)
        function selectNoPreference(representativeId, el) {
            selectedSerialUnits = [];
            selectedSerial = null;
            selectedInventoryId = representativeId;
            document.querySelectorAll('.serial-option').forEach(o => o.classList.remove('selected'));
            if (el) el.classList.add('selected');
            updateSerialSelectionSummary();
        }

        // When specific serials are selected, the quantity is driven by the number
        // of DISTINCT serials chosen, so the quantity input is disabled (each serial
        // is a single unit and can't be reserved more than once).
        function updateSerialSelectionSummary() {
            const summary = document.getElementById('serialSelectionSummary');
            const qtyWrapper = document.getElementById('quantityInputWrapper');
            const qtyInput = document.getElementById('quantityInput');

            if (selectedSerialUnits.length > 0) {
                // Keep the quantity visible but disabled, reflecting the serial count
                if (qtyInput) {
                    qtyInput.value = selectedSerialUnits.length;
                    qtyInput.disabled = true;
                    qtyInput.style.opacity = '0.5';
                    qtyInput.style.cursor = 'not-allowed';
                }
                if (qtyWrapper) qtyWrapper.style.opacity = '0.6';
                if (summary) {
                    summary.style.display = 'block';
                    summary.textContent = `${selectedSerialUnits.length} unit(s) selected (different serials): ${selectedSerialUnits.map(u => u.serial).join(', ')}`;
                }
            } else {
                // No specific serials selected — restore normal quantity input
                if (qtyInput) {
                    qtyInput.value = 1;
                    qtyInput.disabled = false;
                    qtyInput.style.opacity = '';
                    qtyInput.style.cursor = '';
                }
                if (qtyWrapper) qtyWrapper.style.opacity = '';
                if (summary) summary.style.display = 'none';
                selectedQuantity = 1;
            }
        }

        // Select serial
        function selectSerial(serial, inventoryId = null) {
            // Remove previous selection
            document.querySelectorAll('.serial-option').forEach(option => {
                option.classList.remove('selected');
            });

            // Add selection to clicked option
            if (event && event.currentTarget) {
            event.currentTarget.classList.add('selected');
            }
            
            // No need to decode - serial comes directly from data attribute
            selectedSerial = serial;
            selectedInventoryId = inventoryId || currentItemForModal._id;
        }

        // Update quantity
        function updateQuantity(value) {
            selectedQuantity = parseInt(value) || 1;
        }

        // Add selected to cart
        async function addSelectedToCart() {
            const addToCartBtn = document.getElementById('addToCartBtn');

            // Case 1: one or more specific (real) serials selected — add each as a
            // single distinct unit. This guarantees no serial is reserved twice.
            if (selectedSerialUnits.length > 0) {
                showButtonLoading(addToCartBtn);
                try {
                    await addSerialUnitsToCart(selectedSerialUnits);
                    closeModal();
                } catch (error) {
                    console.error('Error adding selected serials to cart:', error);
                } finally {
                    hideButtonLoading(addToCartBtn);
                }
                return;
            }

            // Case 2: "No Preference" or N/A bulk item — single add with quantity
            if (!selectedInventoryId) {
                alert('Please select an option before adding to cart');
                return;
            }

            showButtonLoading(addToCartBtn);
            try {
                await addItemToCart(selectedInventoryId, selectedQuantity, selectedSerial);
                closeModal();
            } catch (error) {
                console.error('Error adding selected item to cart:', error);
                // Error will be shown by addItemToCart
            } finally {
                hideButtonLoading(addToCartBtn);
            }
        }

        // Add multiple distinct serial units to the cart in one request.
        // Each unit is quantity 1 with its own serial, so the same serial can
        // never be reserved more than once.
        async function addSerialUnitsToCart(units) {
            const items = units.map(u => ({
                inventoryId: u.inventoryId,
                quantity: 1,
                specificSerial: u.serial
            }));

            const response = await fetch(`${API_BASE}/api/carts/${eventId}/items/batch`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                },
                body: JSON.stringify({ items })
            });

            const result = await response.json();

            if (!response.ok) {
                alert(result.error || 'Failed to add serials to cart');
                return;
            }

            // Batch endpoint returns a summary (not the full cart) — refresh cart state.
            await loadCart();
            filterAndRenderInventory();

            if (result.failCount > 0) {
                const firstError = (result.results || []).find(r => !r.success);
                showToast(
                    `Added ${result.successCount} unit(s). ${result.failCount} unavailable${firstError ? `: ${firstError.error}` : ''}`,
                    'warning'
                );
            } else {
                showToast(`Added ${result.successCount} unit(s) to cart!`, 'success');
            }
        }

        // Add item to cart (API call)
        async function addItemToCart(inventoryId, quantity, specificSerial) {
            try {
                console.log('Adding item to cart:', { inventoryId, quantity, specificSerial, eventId });
                console.log('Current cart state:', currentCart);
                
                const response = await fetch(`${API_BASE}/api/carts/${eventId}/items`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        inventoryId,
                        quantity,
                        specificSerial
                    })
                });

                console.log('Add to cart response status:', response.status);
                const result = await response.json();
                console.log('Add to cart response:', result);

                if (response.ok) {
                    currentCart = result;
                    updateCartButton();

                    // Re-render from local state instead of re-fetching the whole
                    // inventory. Adding to a cart does NOT create a hard reservation,
                    // so per-item availability from the backend is unchanged; the grid
                    // already subtracts cart quantities locally. This avoids a second
                    // full round-trip on every add. (The atomic reserve step still
                    // re-validates availability, so integrity is preserved.)
                    filterAndRenderInventory();

                    // Show success message
                    const item = currentInventory.find(i => i._id === inventoryId);
                    showToast(`Added ${item?.label || 'item'} to cart!`, 'success');
                } else {
                    console.error('Failed to add to cart:', result);
                    alert(result.error || 'Failed to add item to cart');
                }
            } catch (error) {
                console.error('Error adding to cart:', error);
                alert('Failed to add item to cart. Please try again.');
            }
        }

        // Helper functions
        function isItemInCart(inventoryId) {
            if (!currentCart || !currentCart.items) return false;
            return currentCart.items.some(item => item.inventoryId && item.inventoryId._id === inventoryId);
        }

        function getAvailableQuantity(item) {
            // Use availableQuantity from backend if available (set by API calls that include dates)
            if (typeof item.availableQuantity === 'number') {
                return item.availableQuantity;
            }
            
            // Fallback: return full quantity (doesn't consider reservations or cart items)
            return item.quantity || 0;
        }

        function getSimilarItems(item) {
            const labelParts = item.label.split(' ');
            const brand = labelParts[0];
            const model = labelParts[1] || '';
            
            return currentInventory.filter(i => 
                i.category === item.category &&
                i.label.startsWith(`${brand} ${model}`)
            );
        }

        function updateCartButton() {
            const cartButton = document.getElementById('cartButton');
            const cartCount = document.getElementById('cartCount');
            
            if (currentCart && currentCart.items) {
                const totalItems = currentCart.items.reduce((total, item) => total + item.quantity, 0);
                
                if (totalItems > 0) {
                    cartCount.textContent = totalItems;
                    cartCount.classList.remove('hidden');
                } else {
                    cartCount.classList.add('hidden');
                }
            } else {
                cartCount.classList.add('hidden');
            }
        }

        // Legacy filter functions (these are replaced by the newer ones above)
        // Removed duplicate filterInventory and filterByCategory functions

        // Modal functions
        function closeModal() {
            document.getElementById('serialModal').style.display = 'none';
            
            // Reset button loading state
            const addToCartBtn = document.getElementById('addToCartBtn');
            if (addToCartBtn) {
                hideButtonLoading(addToCartBtn);
            }
            
            // Reset all modal state to prevent cross-contamination
            selectedSerial = null;
            selectedInventoryId = null;
            selectedQuantity = 1;
            currentItemForModal = null;
            selectedSerialUnits = [];
        }

        // Navigation
        function viewCart() {
            window.location.href = `checkout.html?eventId=${eventId}`;
        }

        function goBack() {
            window.location.href = `/dashboard.html#gear?id=${eventId}`;
        }

        // Utility functions
        function formatDate(dateStr) {
            if (!dateStr || dateStr === 'Not set') return dateStr;
            
            // Handle simple date strings like "2025-07-02" without timezone conversion
            if (typeof dateStr === 'string' && dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) {
                const [year, month, day] = dateStr.split('-').map(Number);
                return `${month}/${day}/${year}`;
            }
            
            // Parse other date formats and format consistently without timezone issues
            const date = new Date(dateStr);
            
            // Check if the date is valid
            if (isNaN(date.getTime())) return 'Invalid Date';
            
            // Format as MM/DD/YYYY without timezone manipulation
            return (date.getMonth() + 1) + '/' + date.getDate() + '/' + date.getFullYear();
        }

        function showToast(message, type) {
            // Simple toast notification
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${type === 'success' ? '#28a745' : (type === 'warning' ? '#e0a800' : '#dc3545')};
                color: white;
                padding: 12px 20px;
                border-radius: 8px;
                font-weight: 500;
                z-index: 3000;
                animation: slideIn 0.3s ease;
            `;
            toast.textContent = message;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('serialModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Listen for inventory updates from other pages (like gear page deletions)
        let lastInventoryUpdate = localStorage.getItem('inventoryLastUpdated');
        
        // Check for updates every 2 seconds
        setInterval(() => {
            const currentUpdate = localStorage.getItem('inventoryLastUpdated');
            if (currentUpdate && currentUpdate !== lastInventoryUpdate) {
                console.log('Inventory updated in another tab, refreshing...');
                loadInventory();
                lastInventoryUpdate = currentUpdate;
            }
        }, 2000);
        
        // Listen for same-page updates
        window.addEventListener('inventoryUpdated', () => {
            console.log('Inventory updated, refreshing...');
            loadInventory();
        });
    </script>
</body>
