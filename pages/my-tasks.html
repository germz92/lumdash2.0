<!-- My Tasks Page - All tasks across all events -->
<link rel="stylesheet" href="css/theme-dark.css">

<div class="dark-theme my-tasks-page">
  <div class="my-tasks-layout" id="myTasksPageLayout">
    
    <!-- Sidebar will be injected here by sidebar-dashboard.js -->
    
    <!-- Main Content -->
    <main class="my-tasks-main">
      
      <!-- Header -->
      <header class="my-tasks-header-dark">
        <button class="mobile-menu-btn" id="mobileMenuBtn" title="Open menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="my-tasks-header-left">
          <h1 class="my-tasks-title">
            <span class="material-symbols-outlined">task_alt</span>
            My Tasks
          </h1>
        </div>
        <div class="my-tasks-header-right">
          <div class="progress-section">
            <span class="progress-text" id="progressText">0 / 0 completed</span>
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </header>
      
      <!-- Filter Bar -->
      <div class="my-tasks-filter-bar">
        <div class="filter-left">
          <div class="search-box">
            <span class="material-symbols-outlined">search</span>
            <input type="text" id="taskSearch" placeholder="Search tasks...">
          </div>
        </div>
        <div class="filter-right">
          <button class="filter-btn" id="myTasksFilterBtn">
            <span class="material-symbols-outlined">person</span>
            <span id="myTasksFilterLabel">All Tasks</span>
            <span class="material-symbols-outlined">expand_more</span>
          </button>
          <div class="filter-dropdown" id="myTasksDropdown">
            <button class="filter-option" data-value="all">All Tasks</button>
            <button class="filter-option" data-value="mine">My Tasks Only</button>
          </div>
        </div>
      </div>
      
      <!-- Tasks List -->
      <div class="my-tasks-list-container">
        <div class="my-tasks-table-wrapper">
          <table class="my-tasks-table">
            <thead>
              <tr>
                <th class="col-task">Task</th>
                <th class="col-event">Event</th>
                <th class="col-status">Status</th>
                <th class="col-due">Due Date</th>
                <th class="col-owner">Owner</th>
                <th class="col-notes">Notes</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody id="tasksTableBody">
              <!-- Tasks will be populated here -->
            </tbody>
          </table>
        </div>
        
        <!-- Loading State -->
        <div class="tasks-loading" id="tasksLoading">
          <span class="material-symbols-outlined spinning">sync</span>
          <span>Loading tasks...</span>
        </div>
        
        <!-- Empty State -->
        <div class="tasks-empty" id="tasksEmpty" style="display: none;">
          <span class="material-symbols-outlined">task_alt</span>
          <h3>No tasks found</h3>
          <p>Tasks assigned to you will appear here</p>
        </div>
      </div>
      
    </main>
    
    <!-- Edit Task Modal -->
<div class="dark-modal" id="myTasksEditModal">
  <div class="dark-modal-content">
    <div class="dark-modal-header">
      <h3><span class="material-symbols-outlined">edit</span> Edit Task</h3>
      <button class="modal-close" onclick="window.closeEditTaskModal && window.closeEditTaskModal()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="modal-body-dark">
      <input type="hidden" id="editTaskId">
      <input type="hidden" id="editTaskEventId">
      
      <div class="form-group-dark">
        <label for="editTaskName">Task</label>
        <input type="text" id="editTaskName" placeholder="Task description">
      </div>
      
      <div class="form-group-dark">
        <label>Status</label>
        <div class="custom-dropdown" id="editStatusDropdown">
          <button type="button" class="custom-dropdown-trigger" id="editStatusTrigger">
            <span class="status-dot todo"></span>
            <span class="dropdown-value">To Do</span>
            <span class="material-symbols-outlined dropdown-arrow">expand_more</span>
          </button>
          <div class="custom-dropdown-menu" id="editStatusMenu">
            <button type="button" class="custom-dropdown-option" data-value="todo">
              <span class="status-dot todo"></span> To Do
            </button>
            <button type="button" class="custom-dropdown-option" data-value="in-progress">
              <span class="status-dot in-progress"></span> In Progress
            </button>
            <button type="button" class="custom-dropdown-option" data-value="done">
              <span class="status-dot done"></span> Done
            </button>
          </div>
        </div>
        <input type="hidden" id="editTaskStatus" value="todo">
      </div>
      
      <div class="form-group-dark">
        <label for="editTaskDueDate">Due Date</label>
        <input type="date" id="editTaskDueDate">
      </div>
      
      <div class="form-group-dark">
        <label>Owner</label>
        <div class="custom-dropdown" id="editOwnerDropdown">
          <button type="button" class="custom-dropdown-trigger" id="editOwnerTrigger">
            <span class="dropdown-value placeholder">Select owner...</span>
            <span class="material-symbols-outlined dropdown-arrow">expand_more</span>
          </button>
          <div class="custom-dropdown-menu" id="editOwnerMenu">
            <!-- Options populated by JS -->
          </div>
        </div>
        <input type="hidden" id="editTaskOwner">
      </div>
      
      <div class="form-group-dark">
        <label for="editTaskNotes">Notes</label>
        <textarea id="editTaskNotes" rows="3" placeholder="Additional notes..."></textarea>
      </div>
    </div>
    <div class="modal-footer-dark">
      <button class="btn-secondary" onclick="window.closeEditTaskModal && window.closeEditTaskModal()">Cancel</button>
      <button class="btn-primary" onclick="window.saveEditTask && window.saveEditTask()">
        <span class="material-symbols-outlined">save</span> Save
      </button>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="dark-modal" id="myTasksDeleteModal">
  <div class="dark-modal-content confirm-modal-content">
    <div class="dark-modal-header">
      <h3><span class="material-symbols-outlined" style="color: var(--brand-red);">warning</span> Delete Task</h3>
      <button class="modal-close" onclick="window.closeDeleteTaskModal && window.closeDeleteTaskModal()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="modal-body-dark">
      <p>Are you sure you want to delete this task? This action cannot be undone.</p>
      <input type="hidden" id="deleteTaskId">
      <input type="hidden" id="deleteTaskEventId">
    </div>
    <div class="modal-footer-dark">
      <button class="btn-secondary" onclick="window.closeDeleteTaskModal && window.closeDeleteTaskModal()">Cancel</button>
      <button class="btn-danger" onclick="window.confirmDeleteTask && window.confirmDeleteTask()">
        <span class="material-symbols-outlined">delete</span> Delete
      </button>
    </div>
  </div>
</div>

  </div>
</div>
