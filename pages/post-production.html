<link rel="stylesheet" href="css/theme-dark.css">

<div class="dark-theme post-production-page">
  <div class="post-production-layout" id="postProductionPageLayout">

    <main class="post-production-main">
      <header class="post-production-header">
        <button class="mobile-menu-btn" id="mobileMenuBtn" title="Open menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <h1 class="post-production-title">
          <span class="material-symbols-outlined">movie_edit</span>
          Post Production
        </h1>
      </header>

      <div class="post-production-toolbar">
        <div class="search-box">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="ppSearch" placeholder="Search..." aria-label="Search deliverables">
        </div>
        <div class="pp-bulk-actions" id="ppBulkActions">
          <button type="button" class="pp-actions-trigger" id="ppActionsBtn" disabled aria-haspopup="true" aria-expanded="false">
            <span class="material-symbols-outlined">more_horiz</span>
            <span id="ppActionsBtnLabel">Actions</span>
            <span class="material-symbols-outlined pp-actions-chevron">expand_more</span>
          </button>
          <div class="action-dropdown pp-actions-menu" id="ppActionsMenu" role="menu">
            <button type="button" class="action-item" data-action="duplicate" role="menuitem">
              <span class="material-symbols-outlined">content_copy</span>
              Duplicate
            </button>
            <button type="button" class="action-item" data-action="archive" id="ppActionArchive" role="menuitem">
              <span class="material-symbols-outlined">inventory_2</span>
              <span id="ppActionArchiveLabel">Archive</span>
            </button>
            <div class="dropdown-divider"></div>
            <button type="button" class="action-item danger" data-action="delete" id="ppActionDelete" role="menuitem">
              <span class="material-symbols-outlined">delete</span>
              Delete
            </button>
          </div>
        </div>
        <div class="pp-view-toggle" id="ppViewToggle" role="group" aria-label="View mode">
          <button type="button" class="pp-view-btn active" data-view="table" title="Table view">
            <span class="material-symbols-outlined">table_rows</span>
          </button>
          <button type="button" class="pp-view-btn" data-view="card" title="Card view">
            <span class="material-symbols-outlined">view_agenda</span>
          </button>
        </div>
        <button type="button" class="pp-due-sort-btn" id="ppDueSortBtn" title="Sort by due date">
          <span class="material-symbols-outlined">event</span>
          <span>Due date</span>
          <span class="material-symbols-outlined pp-due-sort-icon" id="ppDueSortIcon">arrow_upward</span>
        </button>
        <div class="status-filter-tabs" id="ppFilterTabs">
          <button type="button" class="status-tab" data-filter="all">All</button>
          <button type="button" class="status-tab active" data-filter="pending">Pending</button>
          <button type="button" class="status-tab" data-filter="completed">Completed</button>
          <button type="button" class="status-tab" data-filter="archived">Archived</button>
        </div>
      </div>

      <div class="post-production-table-container">
        <div class="pp-cards-container" id="ppCardsContainer" aria-hidden="true"></div>

        <div class="post-production-table-wrap">
          <table class="post-production-table" id="ppTable">
            <colgroup>
              <col class="pp-col-select">
              <col class="pp-col-item">
              <col class="pp-col-updates">
              <col class="pp-col-project">
              <col class="pp-col-due">
              <col class="pp-col-avatar">
              <col class="pp-col-status">
              <col class="pp-col-avatar">
              <col class="pp-col-avatar">
              <col class="pp-col-status">
              <col class="pp-col-status">
              <col class="pp-col-version">
            </colgroup>
            <thead>
              <tr>
                <th class="pp-col-select-th">
                  <input type="checkbox" id="ppSelectAll" class="pp-row-checkbox" aria-label="Select all" title="Select all">
                </th>
                <th class="pp-th-item sortable" data-sort="item">Item<span class="sort-icon material-symbols-outlined">unfold_more</span></th>
                <th class="pp-th-updates" aria-label="Updates"><span class="material-symbols-outlined pp-th-updates-icon">forum</span></th>
                <th class="pp-th-project sortable" data-sort="project">Project<span class="sort-icon material-symbols-outlined">unfold_more</span></th>
                <th class="sortable pp-th-due" data-sort="dueDate">Due Date<span class="sort-icon material-symbols-outlined">unfold_more</span></th>
                <th class="sortable pp-th-avatar" data-sort="ownerName" title="Owner">Owner<span class="sort-icon material-symbols-outlined">unfold_more</span></th>
                <th class="sortable pp-th-status" data-sort="editStatus">Edit<span class="sort-icon material-symbols-outlined">unfold_more</span></th>
                <th class="sortable pp-th-avatar" data-sort="editorName" title="Editors">Editors<span class="sort-icon material-symbols-outlined">unfold_more</span></th>
                <th class="sortable pp-th-avatar" data-sort="collaboratorsSortName" title="Collaborators">Collaborators<span class="sort-icon material-symbols-outlined">unfold_more</span></th>
                <th class="sortable pp-th-status" data-sort="qcStatus">QC<span class="sort-icon material-symbols-outlined">unfold_more</span></th>
                <th class="sortable pp-th-status" data-sort="deliveryStatus">Delivery<span class="sort-icon material-symbols-outlined">unfold_more</span></th>
                <th class="pp-th-version" title="Latest version link">Latest Version</th>
              </tr>
            </thead>
            <tbody id="ppTableBody"></tbody>
          </table>
        </div>

        <div class="post-production-loading" id="ppLoading">
          <span class="material-symbols-outlined spinning">sync</span>
          Loading...
        </div>
        <div class="post-production-empty" id="ppEmpty" style="display: none;">
          <span class="material-symbols-outlined">movie_edit</span>
          <p>No deliverables yet</p>
        </div>

        <button type="button" class="btn-add-item" id="ppAddBtn" style="display: none;">
          <span class="material-symbols-outlined">add</span>
          Add item
        </button>
      </div>
    </main>
  </div>
</div>

<!-- Updates side panel -->
<div class="pp-updates-panel" id="ppUpdatesModal" style="display: none;">
  <div class="pp-modal pp-updates-modal dark-theme">
    <div class="pp-modal-header">
      <div>
        <h3 id="ppUpdatesModalTitle">Updates</h3>
        <p class="pp-updates-modal-sub" id="ppUpdatesModalSub"></p>
      </div>
      <button type="button" class="pp-modal-close" id="ppUpdatesClose" aria-label="Close"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="pp-modal-body pp-updates-modal-body">
      <div class="pp-updates-compose" id="ppUpdatesCompose">
        <div class="pp-reply-context" id="ppReplyContext" hidden></div>
        <textarea id="ppUpdateInput" rows="3" placeholder="Write an update… Use @ to mention someone"></textarea>
        <div class="pp-link-form" id="ppLinkForm" hidden>
          <input type="url" id="ppLinkUrl" class="pp-link-url-input" placeholder="https://example.com" autocomplete="off">
          <input type="text" id="ppLinkLabel" class="pp-link-label-input" placeholder="Link label (optional)" autocomplete="off">
          <button type="button" class="pp-compose-tool-btn" id="ppLinkAdd">Add</button>
          <button type="button" class="pp-compose-tool-btn pp-compose-tool-btn-muted" id="ppLinkCancel">Cancel</button>
        </div>
        <div class="pp-compose-pending" id="ppComposePending" hidden></div>
        <div class="pp-updates-compose-bar">
          <div class="pp-updates-compose-tools">
            <button type="button" class="pp-compose-tool-btn" id="ppAttachBtn" title="Attach file" aria-label="Attach file">
              <span class="material-symbols-outlined">attach_file</span>
            </button>
            <button type="button" class="pp-compose-tool-btn" id="ppAddLinkBtn" title="Add link" aria-label="Add link">
              <span class="material-symbols-outlined">link</span>
            </button>
            <input type="file" id="ppAttachInput" hidden accept="image/jpeg,image/png,image/gif,image/webp,application/pdf">
          </div>
          <button type="button" class="pp-btn-primary" id="ppUpdateSave">Post update</button>
        </div>
      </div>
      <div class="pp-updates-feed-wrap">
        <div class="pp-updates-feed-header">
          <span id="ppUpdatesFeedCount">Updates</span>
        </div>
        <div class="pp-updates-feed" id="ppUpdatesFeed"></div>
      </div>
    </div>
  </div>
</div>

<!-- @ mention suggestions -->
<div class="pp-mention-menu" id="ppMentionMenu" style="display: none;"></div>

<!-- User picker dropdown (editors / collaborators / owner) -->
<div class="pp-editor-menu" id="ppUserPickerMenu" style="display: none;"></div>

<!-- Project suggestions -->
<div class="pp-suggestions" id="ppProjectSuggestions" style="display: none;"></div>

<!-- Latest version link editor -->
<div class="pp-version-menu" id="ppVersionMenu" style="display: none;"></div>
