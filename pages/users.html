<!-- Dark Theme Users/Admin Page -->
<link rel="stylesheet" href="css/theme-dark.css">

<div class="dark-theme users-page">
  <div class="dashboard-layout" id="usersPageLayout">
    
    <!-- Sidebar will be injected here by sidebar-dashboard.js -->
    
    <!-- Main Content -->
    <main class="dashboard-main">
      
      <!-- Header -->
      <header class="dashboard-header">
        <button class="mobile-menu-btn" id="mobileMenuBtn" title="Open menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        
        <div class="header-title">
    <h1>User Management</h1>
          <p class="header-subtitle">Manage all users and their permissions</p>
        </div>
        
        <div class="header-actions">
          <button class="header-icon-btn" id="notificationsBtn" title="Notifications">
            <span class="material-symbols-outlined">notifications</span>
          </button>
          <div class="header-avatar" id="headerUserAvatar">
            <div class="placeholder-avatar" id="headerAvatarPlaceholder">
              <span class="material-symbols-outlined">person</span>
            </div>
            <img src="" alt="User" id="headerAvatarImg" style="display: none;">
          </div>
        </div>
      </header>
      
      <!-- Content Area -->
      <div class="dashboard-content users-content">
        
        <!-- Message Area -->
    <div id="messageArea"></div>
        
        <!-- Users Header -->
        <div class="users-header-bar">
          <div class="users-search">
            <div class="search-input-wrapper">
              <span class="material-symbols-outlined">search</span>
              <input type="text" placeholder="Search users..." id="searchUsersInput">
            </div>
          </div>
          
          <div class="users-actions">
            <button class="btn-primary" id="addUserBtn">
              <span class="material-symbols-outlined">person_add</span>
              Add User
            </button>
          </div>
        </div>
        
        <!-- Users Table -->
        <div class="users-table-wrapper">
          <table class="users-table">
        <thead>
          <tr>
                <th>User</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
              <tr><td colspan="4" class="loading-cell">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
        
        <!-- Users Footer -->
        <div class="users-footer">
          <span id="usersCount">Showing 0 users</span>
        </div>
        
      </div>
    </main>
    
  </div>
</div>

<!-- Edit/Reset User Modal -->
<div id="userModal" class="dark-modal">
  <div class="dark-modal-content">
    <div class="modal-header-dark">
    <h3 id="modalTitle">Edit User</h3>
      <button class="modal-close-btn" id="closeModalBtn">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="modal-body-dark">
    <form id="userForm">
      <input type="hidden" id="userId">
        <div class="form-group-dark">
        <label for="userName">Name</label>
          <input type="text" id="userName" required placeholder="Enter user name">
      </div>
        <div class="form-group-dark">
        <label for="userEmail">Email</label>
          <input type="email" id="userEmail" required placeholder="Enter email address">
      </div>
        <div class="form-group-dark">
        <label for="userRole">Role</label>
        <select id="userRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
        <div class="form-group-dark" id="passwordGroup" style="display:none;">
        <label for="userPassword">New Password</label>
          <input type="password" id="userPassword" minlength="6" placeholder="Enter new password">
      </div>
    </form>
    </div>
    <div class="modal-footer-dark">
      <button type="button" id="resetPasswordBtn" class="btn-secondary" style="margin-right: auto; display: none;">
        <span class="material-symbols-outlined">lock_reset</span>
        Reset Password
      </button>
      <button type="button" id="cancelModalBtn" class="btn-secondary">Cancel</button>
      <button type="submit" id="saveUserBtn" class="btn-primary" form="userForm">Save Changes</button>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteUserModal" class="dark-modal">
  <div class="dark-modal-content small">
    <div class="modal-header-dark">
      <h3>Delete User</h3>
      <button class="modal-close-btn" id="closeDeleteModalBtn">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="modal-body-dark">
      <p id="deleteModalMessage">Are you sure you want to delete this user? This action cannot be undone.</p>
    </div>
    <div class="modal-footer-dark">
      <button class="btn-secondary" id="cancelDeleteBtn">Cancel</button>
      <button class="btn-danger" id="confirmDeleteBtn">Delete User</button>
    </div>
  </div>
</div>

<!-- Add config.js first to ensure API_BASE is available -->
<script src="../js/config.js"></script>
<!-- Shared dashboard sidebar component -->
<script src="../js/sidebar-dashboard.js"></script>
<script src="../js/users.js"></script> 

<script>
console.log('✅ users.html (dark theme) loaded');

// Users page specific: search functionality
function searchUsers(query) {
  const tableBody = document.getElementById('userTableBody');
  if (!tableBody) return;
  
  const rows = tableBody.querySelectorAll('tr');
  const lowerQuery = query.toLowerCase();
  
  rows.forEach(row => {
    const name = row.querySelector('td:first-child')?.textContent?.toLowerCase() || '';
    const email = row.querySelector('td:nth-child(2)')?.textContent?.toLowerCase() || '';
    
    if (name.includes(lowerQuery) || email.includes(lowerQuery) || !query) {
      row.style.display = '';
    } else {
      row.style.display = 'none';
    }
  });
  
  // Update count
  const visibleRows = tableBody.querySelectorAll('tr:not([style*="display: none"])');
  const countEl = document.getElementById('usersCount');
  if (countEl) {
    countEl.textContent = `Showing ${visibleRows.length} user${visibleRows.length !== 1 ? 's' : ''}`;
  }
}

// Setup search with debounce
function setupUsersSearch() {
  const searchInput = document.getElementById('searchUsersInput');
  if (searchInput && !searchInput._listenerAttached) {
    let timeout;
    searchInput.addEventListener('input', function() {
      clearTimeout(timeout);
      const value = this.value;
      timeout = setTimeout(() => searchUsers(value), 300);
    });
    searchInput._listenerAttached = true;
  }
}

// Close modals on escape key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    const userModal = document.getElementById('userModal');
    const deleteModal = document.getElementById('deleteUserModal');
    if (userModal?.classList.contains('show')) {
      userModal.classList.remove('show');
      document.body.style.overflow = '';
    }
    if (deleteModal?.classList.contains('show')) {
      deleteModal.classList.remove('show');
      document.body.style.overflow = '';
    }
    document.querySelectorAll('.action-dropdown.show').forEach(d => d.classList.remove('show'));
  }
});

// Initialize search when page loads
setTimeout(setupUsersSearch, 0);
</script>
