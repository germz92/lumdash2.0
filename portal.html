<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Portal — Lumetry Media</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --pt-accent: #CC0007;
      --pt-accent-soft: #ff8a8d;
    }
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background: #111214;
      color: #e8e8ea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--pt-accent-soft); }
    button { font-family: inherit; }

    .pt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 24px;
      border-bottom: 1px solid #2a2b2f;
      background: #16171a;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .pt-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--pt-accent);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      min-width: 0;
    }
    .pt-brand-logo {
      height: 36px;
      width: auto;
      max-width: 140px;
      object-fit: contain;
      display: none;
    }
    .pt-brand-logo.is-visible { display: block; }
    .pt-brand-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pt-header-client { font-size: 0.85rem; color: #9a9ba1; text-align: right; }
    .pt-header-client strong { color: #e8e8ea; }

    .pt-container { max-width: 1140px; margin: 0 auto; padding: 28px 24px 64px; width: 100%; flex: 1; }
    /* Project view fills the whole screen width */
    .pt-container.pt-full { max-width: none; padding: 22px 28px 48px; }

    .pt-loading, .pt-error {
      text-align: center;
      padding: 80px 20px;
      color: #9a9ba1;
      font-size: 0.95rem;
    }
    .pt-error { color: var(--pt-accent-soft); }

    /* Gallery */
    .pt-section { margin-bottom: 36px; }
    .pt-section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pt-section-sub { font-size: 0.8rem; color: #9a9ba1; margin-bottom: 16px; }

    .pt-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 24px;
      padding: 12px 14px;
      background: #16171a;
      border: 1px solid #2a2b2f;
      border-radius: 12px;
    }
    .pt-search {
      flex: 1 1 200px;
      min-width: 160px;
      position: relative;
    }
    .pt-search input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      background: #1a1b1e;
      border: 1px solid #2a2b2f;
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
    }
    .pt-search input:focus { border-color: var(--pt-accent); }
    .pt-search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #6f7076;
      font-size: 0.85rem;
      pointer-events: none;
      user-select: none;
    }
    .pt-toolbar select {
      padding: 10px 12px;
      background: #1a1b1e;
      border: 1px solid #2a2b2f;
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      max-width: 200px;
    }
    .pt-toolbar select:focus { border-color: var(--pt-accent); }
    .pt-toolbar-meta {
      font-size: 0.75rem;
      color: #6f7076;
      margin-left: auto;
      white-space: nowrap;
    }
    .pt-empty-filter {
      text-align: center;
      padding: 48px 20px;
      color: #9a9ba1;
      font-size: 0.92rem;
    }

    .pt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }
    .pt-card {
      background: #1a1b1e;
      border: 1px solid #2a2b2f;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .pt-card:hover { border-color: var(--pt-accent); transform: translateY(-2px); }
    .pt-card-thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0a0a0c;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a4b50;
      font-size: 0.8rem;
    }
    .pt-card-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .pt-card-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      background: rgba(0,0,0,0.7);
      color: #fff;
    }
    .pt-card-tag.review { background: var(--pt-accent); }
    .pt-card-download {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: rgba(31, 122, 61, 0.92);
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      line-height: 1;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .pt-card-download:hover {
      background: #25964b;
      transform: scale(1.06);
    }
    .pt-section-title::before {
      content: '';
      width: 3px;
      height: 1em;
      background: var(--pt-accent);
      border-radius: 2px;
    }
    .pt-folder-block { margin-bottom: 20px; }
    .pt-folder-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #c4c5ca;
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }
    .pt-card-body { padding: 12px 14px; }
    .pt-card-title { font-weight: 600; font-size: 0.92rem; margin-bottom: 3px; }
    .pt-card-meta { font-size: 0.75rem; color: #9a9ba1; }

    /* Project view */
    .pt-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: #9a9ba1;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
      padding: 4px 0;
    }
    .pt-back:hover { color: #e8e8ea; }

    .pt-project-head { margin-bottom: 14px; }
    .pt-project-title { font-size: 1.3rem; font-weight: 700; }
    .pt-project-sub { font-size: 0.82rem; color: #9a9ba1; margin-top: 3px; }

    .pt-project-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr);
      gap: 20px;
      align-items: start;
    }

    .pt-player-col { min-width: 0; }
    .pt-version-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .pt-version-bar select {
      padding: 8px 12px;
      background: #1a1b1e;
      border: 1px solid #2a2b2f;
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
    }
    .pt-version-note { font-size: 0.78rem; color: #9a9ba1; }

    .pt-player-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    .pt-player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    .pt-player-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9a9ba1;
      font-size: 0.85rem;
      text-align: center;
      padding: 20px;
    }

    /* Frame.io-style comment markers under the player */
    .pt-marker-rail {
      margin-top: 4px;
      padding: 0 2px;
    }
    .pt-marker-track {
      position: relative;
      height: 22px;
      border-radius: 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .pt-marker-range-bar {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 3px;
      background: rgba(110, 185, 255, 0.55);
      border-radius: 2px;
      pointer-events: none;
      z-index: 1;
    }
    .pt-marker-range-bar.resolved { opacity: 0.4; }
    .pt-marker {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translate(-50%, -50%);
      box-sizing: border-box;
      width: 22px;
      height: 22px;
      min-width: 22px;
      max-width: 22px;
      padding: 0;
      margin: 0;
      border-radius: 50%;
      border: 2px solid #121316;
      background: #6eb9ff;
      color: #0b1220;
      font-size: 0.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      text-transform: none;
      cursor: pointer;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      box-shadow: none;
      overflow: hidden;
      flex-shrink: 0;
      aspect-ratio: 1 / 1;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .pt-marker.team { background: #8fd4ff; }
    .pt-marker.client { background: #6eb9ff; }
    .pt-marker.resolved { opacity: 0.45; filter: grayscale(0.35); }
    .pt-marker:hover {
      transform: translate(-50%, -50%) scale(1.14);
      z-index: 6;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35);
    }
    .pt-marker.is-active {
      z-index: 5;
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(110, 185, 255, 0.45);
    }

    .pt-download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 11px 20px;
      background: #1f7a3d;
      color: #fff;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
    }

    .pt-howto {
      margin-top: 10px;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      font-size: 0.72rem;
      color: #6f7076;
      line-height: 1.4;
    }
    .pt-howto strong { font-weight: 600; color: #9a9ba1; }

    .pt-decision-box {
      margin-top: 14px;
      padding: 14px;
      background: #1a1b1e;
      border: 1px solid #2a2b2f;
      border-radius: 10px;
    }
    .pt-decision-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 6px; }
    .pt-decision-sub { font-size: 0.78rem; color: #9a9ba1; margin-bottom: 12px; line-height: 1.4; }
    .pt-decision-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .pt-decision-approve {
      padding: 10px 16px;
      background: #1f7a3d;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .pt-decision-result {
      font-size: 0.85rem;
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.4;
    }
    .pt-decision-result.approved { background: rgba(46,204,113,0.12); color: #2ecc71; }
    .pt-card-tag.approved { background: #1f7a3d; }
    .pt-due-pill {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.7rem;
      color: #ffb020;
    }

    /* Comments */
    .pt-comments-col {
      background: #1a1b1e;
      border: none;
      border-left: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 0;
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 120px);
      position: sticky;
      top: 78px;
    }
    .pt-comments-title {
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #9a9ba1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .pt-comments-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 80px;
    }
    .pt-comments-empty { color: #9a9ba1; font-size: 0.82rem; text-align: center; padding: 24px 8px; }

    .pt-player-stack { display: grid; gap: 10px; }
    .pt-player-stack.compare-on { grid-template-columns: 1fr 1fr; }
    .pt-compare-btn {
      padding: 6px 10px;
      background: #232428;
      border: 1px solid #2a2b2f;
      border-radius: 8px;
      color: #9a9ba1;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .pt-tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      padding: 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: #9a9ba1;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .pt-tool-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #e8e8ea;
    }
    .pt-tool-btn.active {
      border-color: rgba(255, 255, 255, 0.12);
      color: var(--pt-accent-soft);
      background: rgba(255, 255, 255, 0.06);
    }
    .pt-annotate-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
      min-height: 28px;
    }
    .pt-annotate-hint {
      font-size: 0.7rem;
      color: #6f7076;
      opacity: 0.85;
    }
    .pt-annotate-hint:empty { display: none; }
    .pa-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: 2; pointer-events: none; touch-action: none;
    }
    .pa-canvas.pa-active { pointer-events: auto; cursor: crosshair; }
    .pt-ann-tag {
      font-size: 0.62rem; font-weight: 600; color: #9a9ba1;
      background: transparent; padding: 0; border-radius: 0;
      text-transform: uppercase; letter-spacing: 0.02em; opacity: 0.8;
    }

    .pt-comment {
      position: relative;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      border-left: 2px solid transparent;
      border-radius: 0;
      padding: 10px 48px 10px 10px;
      transition: background 0.12s ease;
    }
    .pt-comment.has-tc { cursor: pointer; }
    .pt-comment:hover,
    .pt-comment.has-tc:hover,
    .pt-comment.is-active {
      background: rgba(255, 255, 255, 0.04);
    }
    .pt-comment.is-active {
      background: rgba(255, 255, 255, 0.06);
    }
    .pt-resolved-tag {
      position: absolute;
      top: 8px;
      right: 6px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #0b1a10;
      background: #2ecc71;
      letter-spacing: 0;
    }
    .pt-comment-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-size: 0.72rem;
      flex-wrap: wrap;
    }
    .pt-comment-author { font-weight: 600; }
    .pt-comment-author.team { color: var(--pt-accent-soft); }
    .pt-comment-author.client { color: #4da3ff; }
    .pt-comment-date { color: #6f7076; margin-left: auto; white-space: nowrap; opacity: 0.85; }
    .pt-comment-body {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 8px;
    }
    .pt-comment-tc {
      display: inline-block;
      padding: 1px 7px;
      background: rgba(255, 176, 32, 0.14);
      color: #ffb020;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.68rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      flex-shrink: 0;
      line-height: 1.4;
    }
    .pt-comment-text {
      font-size: 0.82rem;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
      min-width: 120px;
      line-height: 1.45;
    }
    .pt-reply {
      margin-top: 8px;
      padding: 6px 0 0 10px;
      background: transparent;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
    }
    .pt-comment-actions {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      opacity: 0.55;
      transition: opacity 0.12s ease;
    }
    .pt-comment:hover .pt-comment-actions,
    .pt-comment.is-active .pt-comment-actions {
      opacity: 1;
    }
    .pt-comment-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: none;
      border: none;
      border-radius: 6px;
      color: #9a9ba1;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
      min-width: 0;
    }
    .pt-comment-icon-btn:hover {
      color: #e8e8ea;
      background: rgba(255, 255, 255, 0.06);
    }
    .pt-reply-form { display: flex; gap: 6px; margin-top: 8px; }
    .pt-reply-form input {
      flex: 1;
      min-width: 0;
      padding: 7px 10px;
      background: #111214;
      border: 1px solid #2a2b2f;
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
    }

    .pt-compose { margin-top: 12px; padding-top: 12px; border-top: 1px solid #2a2b2f; }
    .pt-compose textarea {
      width: 100%;
      padding: 10px 12px;
      background: #111214;
      border: 1px solid #2a2b2f;
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      resize: vertical;
      min-height: 56px;
    }
    .pt-compose textarea:focus { border-color: var(--pt-accent); }
    .pt-compose-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .pt-tc-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 12px;
      background: #232428;
      border: 1px solid #2a2b2f;
      border-radius: 8px;
      color: #9a9ba1;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .pt-tc-btn.active { border-color: var(--pt-accent); color: var(--pt-accent-soft); }
    .pt-send-btn {
      margin-left: auto;
      padding: 9px 20px;
      background: var(--pt-accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .pt-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pt-compose-hint { font-size: 0.72rem; color: #6f7076; margin-top: 6px; }

    .pt-author-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.78rem;
      color: #9a9ba1;
    }
    .pt-author-row strong { color: #e8e8ea; }
    .pt-author-change {
      background: none;
      border: none;
      color: #ff6b6e;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }

    /* Shared-link name gate */
    .pt-gate {
      max-width: 420px;
      margin: 80px auto;
      background: #1a1b1e;
      border: 1px solid #2a2b2f;
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
    }
    .pt-gate h2 { font-size: 1.2rem; margin-bottom: 8px; }
    .pt-gate p { font-size: 0.88rem; color: #9a9ba1; margin-bottom: 20px; line-height: 1.5; }
    .pt-gate input {
      width: 100%;
      padding: 12px 14px;
      background: #111214;
      border: 1px solid #2a2b2f;
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
    }
    .pt-gate input:focus { border-color: var(--pt-accent); }
    .pt-gate-error {
      color: #ff6b6b;
      font-size: 0.82rem;
      margin: -4px 0 12px;
      min-height: 1.1em;
    }
    .pt-gate-btn {
      width: 100%;
      padding: 12px;
      background: var(--pt-accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .pt-gate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .pt-note { text-align: center; color: #6f7076; font-size: 0.78rem; margin-top: 28px; }
    .pt-footer {
      text-align: center;
      padding: 16px 24px 28px;
      color: #6f7076;
      font-size: 0.72rem;
      border-top: 1px solid #2a2b2f;
    }
