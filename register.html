<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121216">
  <script src="js/theme-early.js?v=2.0.0"></script>
  <title>Register - LumDash</title>
  <link rel="shortcut icon" type="image/x-icon" href="assets/favicon.png">

  <link rel="stylesheet" href="css/theme-tokens.css?v=2.0.0">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/theme-light.css?v=2.0.0">
  <script src="js/theme.js?v=2.0.0"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body class="register-page">
  <div class="auth-wrapper">
    <div class="auth-card">
      <img src="assets/Logo - Dark BG.png" alt="Lumetry Media" class="auth-logo">
      <h1>Join Us</h1>
      <h2 id="registerSubtitle">Create your account</h2>
      <p id="registerInviteNote" class="auth-note" style="display:none;"></p>
      <p id="registerError" class="auth-error" style="display:none;"></p>
      <input id="regFullName" placeholder="Full name" type="text" autocomplete="name">
      <input id="regEmail" placeholder="Email address" type="email" autocomplete="email">
      <input id="regPassword" placeholder="Password (min 6 characters)" type="password" autocomplete="new-password">
      <button id="registerButton" onclick="register()">Create Account</button>
      <a href="index.html" class="toggle-link">Already have an account? <strong>Sign in</strong></a>
    </div>
  </div>
  <script src="js/register.js"></script>
</body>
</html>
