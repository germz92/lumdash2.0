            // Enter moves to the next field and never starts the check-out: a label scanned while
            // one of these fields has the cursor types its code and presses Enter
            $('manualForm').addEventListener('keydown', (event) => {
                if (event.key !== 'Enter' || event.target.tagName !== 'INPUT') return;
                event.preventDefault();
                const fields = ['manualName', 'manualReason', 'manualDue', 'manualEmail', 'manualStartBtn'];
                const next = fields[fields.indexOf(event.target.id) + 1];
                if (next) $(next).focus();
            });

            $('sidePanel').addEventListener('click', (event) => {
                const returnBtn = event.target.closest('.mark-returned-btn');
                if (returnBtn) {
                    markReturned(returnBtn.dataset.lineId, returnBtn);
                    return;
                }
                if (event.target.closest('#clearScansBtn')) {
                    if (state.mode === 'in') confirmClearCheckins();
                    else if (state.mode === 'out') confirmClearScans();
                    return;
                }
                if (event.target.closest('#refreshSideBtn')) {
                    if (state.mode === 'in') loadOutstanding();
                    else if (state.mode === 'out') loadLines();
                    scanner.focus();
                    return;
                }
                if (event.target.closest('#saveSideDatesBtn')) {
                    saveSideDates();
                }
            });

            async function saveSideDates() {
                if (!state.eventId || !canReserve) return;
                const outEl = $('sideCheckOut');
                const inEl = $('sideCheckIn');
                const errEl = $('sideDatesError');
                const out = outEl && outEl.value;
                const inn = inEl && inEl.value;
                if (errEl) { errEl.hidden = true; errEl.textContent = ''; }
                if (!out || !inn) {
                    if (errEl) { errEl.hidden = false; errEl.textContent = 'Choose both dates.'; }
                    return;
                }
                if (inn < out) {
                    if (errEl) { errEl.hidden = false; errEl.textContent = 'Due back must be on or after check-out.'; }
                    return;
                }
                const btn = $('saveSideDatesBtn');
                if (btn) btn.disabled = true;
                try {
                    const result = await apiPut(`/api/tables/${state.eventId}/gear-dates`, {
                        checkOutDate: out,
                        checkInDate: inn
                    });
                    const event = events.find(e => e._id === state.eventId);
                    if (event) {
                        if (!event.gear) event.gear = {};
                        event.gear.checkOutDate = result.checkOutDate || out;
                        event.gear.checkInDate = result.checkInDate || inn;
                    }
                    renderEventOptions();
                    await loadLines();
                    if (scanner && scanner.showResult) {
                        scanner.showResult({
                            result: 'ok',
                            level: 'ok',
                            title: 'Dates saved',
                            detail: `${formatDay(out)} - ${formatDay(inn)}${result.updatedLines ? ` · ${result.updatedLines} item${result.updatedLines === 1 ? '' : 's'} updated` : ''}`
                        }, { sound: false });
                    }
                } catch (error) {
                    if (errEl) { errEl.hidden = false; errEl.textContent = error.message; }
                    else if (scanner && scanner.showResult) {
                        scanner.showResult({
                            result: 'error',
                            level: 'error',
                            title: 'Could not save dates',
                            detail: error.message
                        }, { sound: false });
                    }
                } finally {
                    if (btn) btn.disabled = false;
                }
            }

            // Another computer may have changed things while this tab was in the background
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) return;
                if (state.mode === 'in') loadOutstanding();
                else if (state.mode === 'out' && hasTarget()) loadLines();
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!localStorage.getItem('token')) {
                window.location.href = 'index.html';
                return;
            }

            restoreState();

            scanner = window.GearScanner.create({
                container: $('scannerMount'),
                onScan: handleScan,
                onUndo: handleUndo,
                large: true,
                title: MODES[state.mode].title,
                hint: MODES[state.mode].hint,
                idleText: MODES[state.mode].idle
            });
            wireEvents();
            setMode(state.mode, { keepRecent: true });
            scanner.start();

            const sidebarContainer = $('sidebarContainer');
            if (sidebarContainer && window.injectDashboardSidebar) {
                window.injectDashboardSidebar(sidebarContainer, { position: 'replace', activePage: 'scan-station' })
                    .catch(error => console.error('Scan station: sidebar failed to load', error));
            }

            await Promise.all([loadEvents(), loadManualList()]);
            await loadEvent();

            // A remembered walk-up check-out from an earlier day that never had anything
            // scanned onto it is not worth coming back to
            if (state.manual && !linesError && lines.length === 0 && state.manual.endDate < localDay(0)) {
                state.manual = null;
                saveState();
                renderEventOptions();
                await loadEvent();
            }
            scanner.focus();
        });
    })();
    </script>
</body>
</html>
