<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>SD Card Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #121216;
      --bg-secondary: #18181c;
      --bg-tertiary: #1e1e24;
      --bg-elevated: #252530;
      --bg-hover: #2a2a36;
      --surface-card: #1a1a20;
      --surface-modal: #1e1e26;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-default: rgba(255, 255, 255, 0.10);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.75);
      --text-tertiary: rgba(255, 255, 255, 0.5);
      --brand-red: #CC0007;
      --brand-red-hover: #e6000a;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    *, *:before, *:after {
      box-sizing: border-box;
    }

    html {
      width: 100vw;
      overflow-x: hidden;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', 'Roboto', Arial, sans-serif;
      margin: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
    }

    h2 {
      text-align: center;
      color: var(--text-primary);
      margin-top: 20px;
      letter-spacing: 0.5px;
      font-size: 1.5em;
      font-weight: 600;
    }

    .center {
      text-align: center;
      margin-top: 16px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-right: 6px;
    }

    input[type="number"] {
      width: 56px;
      padding: 6px 8px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      font-size: 14px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      transition: border 0.2s;
      margin: 0 6px 8px 0;
      font-family: inherit;
    }

    input[type="number"]:focus {
      border: 1.5px solid var(--brand-red);
      outline: none;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
    }

    button {
      background: var(--brand-red);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      margin-bottom: 8px;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
    }

    button:hover {
      background: var(--brand-red-hover);
      transform: translateY(-1px);
    }

    form#cameraForm {
      background: var(--bg-secondary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      max-width: 400px;
      margin: 16px auto 0 auto;
      padding: 16px 12px 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: auto;
    }

    #cameraForm > div {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 12px;
      margin-bottom: 10px;
    }

    #cameraForm label {
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #cameraForm input[type="number"] {
      margin-bottom: 0;
      width: 44px;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      overflow: hidden;
      font-size: 14px;
    }

    th, td {
      border: none;
      padding: 12px 8px;
      text-align: center;
      font-size: 14px;
    }

    th {
      background: var(--brand-red);
      color: #fff;
      font-weight: 600;
      letter-spacing: 0.3px;
      font-size: 13px;
      text-transform: uppercase;
    }

    td {
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-subtle);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:nth-child(even) td {
      background: var(--bg-tertiary);
    }

    tr:hover td {
      background: var(--bg-hover);
      transition: background 0.2s;
    }

    .summary {
      margin-top: 20px;
      font-weight: 500;
      background: var(--bg-secondary);
      padding: 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-default);
      color: var(--text-secondary);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      font-size: 14px;
      line-height: 1.8;
    }

    .input-arrows-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 2px;
    }

    .arrow-btn {
      background: transparent;
      color: var(--text-secondary);
      border: none;
      border-radius: 6px;
      width: 28px;
      height: 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      touch-action: manipulation;
    }

    .arrow-btn:hover {
      background: var(--brand-red);
      color: #fff;
    }

    #clearBtn {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    #clearBtn:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .main-center {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 32px 16px;
    }

    .cards-total {
      color: var(--brand-red);
      font-size: 1.7em;
      font-weight: 700;
      margin-top: 10px;
      margin-bottom: 2px;
      letter-spacing: 1px;
      display: block;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 16px;
    }

    table {
      min-width: 520px;
      max-width: 100%;
    }

    .clear-btn-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 24px;
      margin-bottom: 8px;
    }

    .cameras-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 24px;
      margin-bottom: 4px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 8px 16px;
      margin: 16px 0 0 16px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .back-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .back-arrow {
      margin-right: 6px;
    }

    @media (max-width: 600px) {
      .main-center {
        max-width: 100vw;
        padding: 0 8px 24px 8px;
      }

      table {
        min-width: 420px;
        font-size: 12px;
      }

      th, td {
        padding: 8px 4px;
        font-size: 12px;
      }

      h2 {
        font-size: 1.1em;
        margin-top: 10px;
      }

      .center {
        margin-top: 8px;
      }

      form#cameraForm, .summary {
        max-width: 98vw;
        padding: 10px 8px 6px 8px;
      }

      #cameraForm > div {
        flex-direction: row;
        gap: 6px 4px;
      }

      #cameraForm label {
        font-size: 11px;
      }

      #cameraForm input[type="number"] {
        width: 44px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <button onclick="goBackToCardLog()" class="back-btn">
    <span class="material-symbols-outlined" style="font-size: 18px; margin-right: 4px;">arrow_back</span>
    Back to Card Log
  </button>
  <h2>SD Card Calculator</h2>
  <div class="main-center">
    <div class="center">
      <label>Number of Days
        <span class="input-arrows-group" style="margin-left:8px;">
          <button type="button" class="arrow-btn" onclick="decrementDays()">&#8722;</button>
          <input type="number" id="numDays" value="1" min="1" style="width:44px; text-align:center; border:none; background:transparent;">
          <button type="button" class="arrow-btn" onclick="incrementDays()">&#43;</button>
        </span>
      </label>
    </div>
    <div class="cameras-label">Cameras Per Day</div>
    <form id="cameraForm" class="center"></form>
    <div id="results"></div>
    <div class="clear-btn-container">
      <button id="clearBtn" onclick="clearTable()" type="button">
        Clear Table
      </button>
    </div>
  </div>

  <script>
    function generateTable() {
      const numDays = parseInt(document.getElementById('numDays').value);
      const form = document.getElementById('cameraForm');
      form.innerHTML = '';

      // Create a flex container for horizontal stacking
      const daysContainer = document.createElement('div');
      daysContainer.style.display = 'flex';
      daysContainer.style.flexWrap = 'wrap';
      daysContainer.style.justifyContent = 'center';
      daysContainer.style.gap = '10px 12px';
      daysContainer.style.marginBottom = '10px';

      for (let i = 1; i <= numDays; i++) {
        const dayGroup = document.createElement('div');
        dayGroup.style.display = 'flex';
        dayGroup.style.flexDirection = 'column';
        dayGroup.style.alignItems = 'center';
        dayGroup.style.minWidth = '90px';
        dayGroup.innerHTML = `
          <label for="day${i}">Day ${i}</label>
          <div class="input-arrows-group">
            <button type="button" class="arrow-btn" onclick="decrement('day${i}')">&#8722;</button>
            <input type="number" id="day${i}" name="day${i}" min="0" value="2" style="border:none; background:transparent;">
            <button type="button" class="arrow-btn" onclick="increment('day${i}')">&#43;</button>
          </div>
        `;
        daysContainer.appendChild(dayGroup);
      }
      form.appendChild(daysContainer);
      form.innerHTML += '<button type="button" onclick="calculateSDCards()"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;margin-right:4px;">calculate</span>Calculate</button>';
    }

    function calculateSDCards() {
      const formData = new FormData(document.getElementById('cameraForm'));
      let results = '<div class="table-responsive"><table><tr><th>Day</th><th>Cameras</th><th>SD Cards Needed</th><th>Available for Reuse</th><th>New Cards</th><th>Extra Cards EOD</th></tr>';

      let prevCameras = 0;
      let prevExtraCards = 0;
      let totalNewCards = 0;
      let numDays = 0;
      let reuseAvailable = 0;
      for (let [key, value] of formData.entries()) {
        numDays++;
        const day = key.replace('day', '');
        const cameras = parseInt(value);
        const cardsNeeded = cameras * 2;
        // For the first day, reuseAvailable is 0. For subsequent days, it's prevCameras + prevExtraCards
        if (numDays === 1) {
          reuseAvailable = 0;
        } else {
          reuseAvailable = prevCameras + prevExtraCards;
        }
        const newCards = Math.max(0, cardsNeeded - reuseAvailable);
        const extraCards = reuseAvailable + newCards - cardsNeeded;
        totalNewCards += newCards;

        results += `<tr><td>${day}</td><td>${cameras}</td><td>${cardsNeeded}</td><td>${reuseAvailable}</td><td>${newCards}</td><td>${extraCards}</td></tr>`;

        prevCameras = cameras;
        prevExtraCards = extraCards;
      }

      const backupsNeeded = numDays * 2; // two backup cards per day
      const totalWithBackups = totalNewCards + backupsNeeded;

      results += '</table></div>';
      results += `<div class="summary">
        📦 Cards Needed: ${totalNewCards} <br>
        🔄 Backups Needed (2/day): ${backupsNeeded} <br>
        <span class="cards-total">🎯 Cards Total: ${totalWithBackups}</span>
      </div>`;

      document.getElementById('results').innerHTML = results;
    }

    function increment(id) {
      const input = document.getElementById(id);
      if (input) input.value = parseInt(input.value || 0) + 1;
    }
    function decrement(id) {
      const input = document.getElementById(id);
      if (input) input.value = Math.max(0, parseInt(input.value || 0) - 1);
    }

    function incrementDays() {
      const input = document.getElementById('numDays');
      input.value = parseInt(input.value || 1) + 1;
      generateTable();
    }
    function decrementDays() {
      const input = document.getElementById('numDays');
      input.value = Math.max(1, parseInt(input.value || 1) - 1);
      generateTable();
    }

    function clearTable() {
      if (window.confirm('Are you sure you want to clear the table and start over?')) {
        document.getElementById('cameraForm').innerHTML = '';
        document.getElementById('results').innerHTML = '';
        document.getElementById('numDays').value = 1;
      }
    }

    function goBackToCardLog() {
      // Use the SPA's navigation system to go back to card-log
      if (window.navigate) {
        window.navigate('card-log', localStorage.getItem('currentTableId'));
      } else if (window.history && window.history.back) {
        // Fallback to browser history if available
        window.history.back();
      } else {
        // Last resort: direct page navigation
        window.location.href = 'dashboard.html#card-log';
      }
    }
  </script>
</body>
</html>
